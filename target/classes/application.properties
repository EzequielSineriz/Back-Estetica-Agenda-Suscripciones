spring.application.name=AppEstetica


server.port=${PORT:8080}


spring.datasource.url=jdbc:mysql://srv807.hstgr.io:3306/u266493830_back_estetica?useSSL=false&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false

application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.frontend-base-url=${FRONTEND_BASE_URL:https://healthestetica.com}
mercadopago.backend-base-url=${BACKEND_BASE_URL:https://backhealthestetica.onrender.com}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false


spring.jpa.hibernate.ddl-auto=none

spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000