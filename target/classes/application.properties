spring.application.name=AppEstetica

# 1. El puerto din�mico para Render (OBLIGATORIO)
server.port=${PORT:8080}

# 2. Base de Datos (Hostinger)
# Reemplaza 'IP_DE_HOSTINGER' por la IP que te da tu panel de Hostinger
spring.datasource.url=jdbc:mysql://IP_DE_HOSTINGER:3306/app_estetica?useSSL=false&serverTimezone=UTC
spring.datasource.username=tu_usuario_hostinger
spring.datasource.password=tu_password_hostinger
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. SEGURIDAD: Cambia create-drop por update para no perder datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

