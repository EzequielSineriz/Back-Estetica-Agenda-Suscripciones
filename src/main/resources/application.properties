spring.application.name=AppEstetica


server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:mysql://srv807.hstgr.io:3306/u266493830_back_estetica?useSSL=false&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false

application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000


mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.frontend-base-url=${FRONTEND_BASE_URL:https://healthestetica.com}
mercadopago.backend-base-url=${BACKEND_BASE_URL:https://backhealthestetica.onrender.com}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false


# 1. Reducir el max-lifetime a 1 o 2 minutos (Hostinger cierra rápido las conexiones idles)
# 120000 ms = 2 minutos (debe ser menor al wait_timeout de Hostinger)
spring.datasource.hikari.max-lifetime=120000

# . Bajar el tiempo de keepalive para enviar pings más seguidos y mantener la conexión activa
# 30000 ms = 30 segundos
spring.datasource.hikari.keepalive-time=30000

# Mantiene pocas conexiones incactivas
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3

# Prueba de conexion
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=3000
